<!-- layouts/employee-layout/employee-layout.component.html -->
<div class="d-flex vh-100">
    <aside class="sidebar text-white p-3 d-flex flex-column justify-content-between" style="width: 280px;">
        <div>
            <!-- Logo + Project Name -->
            <div class="text-center mb-4 d-flex  align-items-center gap-3">
                <img src="favicon.ico" alt="Loopify Logo" style="width: 40px;">
                <h4 class="mt-2">Loopify</h4>
            </div>

            <!-- Nav List -->
            <ul class="nav flex-column">
                <li class="nav-item mb-2">
                    <a class="nav-link d-flex align-items-center" routerLink="/admin" routerLinkActive="active-link"
                        [routerLinkActiveOptions]="{ exact: true }">
                        <i class="fa-solid fa-chart-simple me-2 nav-icon"></i>
                        Dashboard
                    </a>
                </li>


                <li class="nav-item mb-2">
                    <a class="nav-link  d-flex" routerLink="/admin/user-management" routerLinkActive="active-link"
                        [routerLinkActiveOptions]="{ exact: true }">
                        <i class="fa-solid fa-users me-2 nav-icon"></i> User Management
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link  d-flex" routerLink="/admin/pickup-req" routerLinkActive="active-link"
                        [routerLinkActiveOptions]="{ exact: true }">
                        <i class="fa-solid fa-truck me-2 nav-icon"></i> Pickup Requests
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link  d-flex" routerLink="/admin/warehouse-inventory" routerLinkActive="active-link"
                        [routerLinkActiveOptions]="{ exact: true }">
                        <i class="fa-solid fa-warehouse me-2 nav-icon"></i> Warehouse Inventory
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link  d-flex" routerLink="/admin/redeem-catalog" routerLinkActive="active-link"
                        [routerLinkActiveOptions]="{ exact: true }">
                        <i class="fa-solid fa-gift me-2 nav-icon"></i> Redemption Catalog
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link  d-flex" routerLink="/admin/material" routerLinkActive="active-link"
                        [routerLinkActiveOptions]="{ exact: true }">
                        <i class="fa-solid fa-record-vinyl me-2 nav-icon"></i> Materials Management
                    </a>
                </li>
            </ul>
        </div>

        <ul class="nav flex-column">
            <li class=" mb-2">
                <a class="nav-link d-flex align-items-center" routerLink="/admin/profile">
                    <img src="assets/profileEmp.svg" class="me-2 " alt="" width="20">
                    Profile
                </a>
            </li>


            <li class="nav-item mb-2">
                <a class="nav-link d-flex text-danger" (click)="logout()">

                    <img src="assets/logout.svg" class="me-2 " alt="" width="20"> LogOut
                </a>
            </li>

        </ul>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow-1 p-4 bg-light" style="overflow: auto;">
        <router-outlet></router-outlet>
    </main>
</div>
