<div class="summary-card p-4 rounded-lg shadow-sm cursor-pointer" [ngClass]="color">
  <div class="flex justify-between items-start">
    <div>
      <h3 class="text-sm text-gray-600 font-medium">{{ title }}</h3>
      <p class="amount-text text-2xl font-bold mt-1 transition-colors duration-200">
        {{ amount }} <span class="text-xl">{{ unit }}</span>
      </p>
    </div>
    <div class="icon-container p-2 rounded-full bg-white/50" [innerHTML]="icon"></div>
  </div>
</div>
