<div class="p-4 md:p-6 w-full">
  <div class="mb-6">
    <h1 class="page-title">
      Warehouse Inventory
    </h1>
    <p class="page-subtitle">
      Manage and track all recyclable materials received in the warehouse
    </p>
  </div>
  
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
    <app-material-summary-card 
      title="Total Plastic" 
      amount="2,500" 
      unit="kg" 
      icon='<img src="assets/div2.png" alt="Plastic Icon" class="h-10 w-10  inline-block align-middle" />'
      color="bg-blue-50">
    </app-material-summary-card>
    
    <app-material-summary-card 
      title="Total Metal" 
      amount="1,800" 
      unit="Kg" 
      icon='<img src="assets/div1.png" alt="Plastic Icon" class="h-10 w-10  inline-block align-middle" />'
      color="bg-green-50">
    </app-material-summary-card>
    
    <app-material-summary-card 
      title="Total Paper" 
      amount="950" 
      unit="Kg" 
      icon='<img src="assets/div.png" alt="Plastic Icon" class="h-10 w-10  inline-block align-middle" />'
      color="bg-orange-50">
    </app-material-summary-card>
    
    <app-material-summary-card 
      title="Total Glass" 
      amount="720" 
      unit="Kg" 
      icon='<img src="assets/div3.png" alt="Plastic Icon" class="h-10 w-10  inline-block align-middle" />'
      color="bg-purple-50">
    </app-material-summary-card>
  </div>
  
  <div class="mt-8 flex flex-col lg:flex-row gap-4 mb-6">
    <div class="w-full lg:w-1/3">
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Material Type
      </label>
      <div class="relative">
        <select class="block w-full pl-3 pr-10 py-2 text-base border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 rounded-md transition-all duration-200">
          <option>All</option>
          <option>Plastic</option>
          <option>Metal</option>
          <option>Paper</option>
          <option>Glass</option>
        </select>
      </div>
    </div>
    <div class="w-full lg:w-2/3">
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Search by ID
      </label>
      <input 
        type="text" 
        placeholder="Enter ID..." 
        class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all duration-200" />
    </div>
  </div>
  
  <app-inventory-table></app-inventory-table>
</div>
