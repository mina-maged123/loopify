<div class="modal-backdrop" *ngIf="isVisible" (click)="onBackdropClick($event)">
  <div class="modal-container" role="dialog" aria-labelledby="modal-title" aria-modal="true">
    <!-- Modal Header -->
    <div class="modal-header">
      <h2 id="modal-title" class="modal-title">Add New Gift</h2>
      <button class="close-btn" (click)="onClose()" aria-label="Close modal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
  <form (ngSubmit)="onSave()" #giftForm="ngForm">
    <!-- Gift Name Field -->
    <div class="form-group">
      <label for="giftName" class="form-label">
        Gift Name<span class="required">*</span>
      </label>
      <input
        type="text"
        id="giftName"
        name="giftName"
        class="form-input"
        placeholder="Enter gift name"
        [(ngModel)]="formData.name"
        required
        #giftName="ngModel">
    </div>

    <!-- Description Field -->
    <div class="form-group">
      <label for="description" class="form-label">
        Description<span class="required">*</span>
      </label>
      <textarea
        id="description"
        name="description"
        class="form-input"
        placeholder="Enter a brief description"
        rows="3"
        [(ngModel)]="formData.description"
        #description="ngModel"></textarea>
    </div>

    <!-- Points Required Field -->
    <div class="form-group">
      <label for="pointsRequired" class="form-label">
        Points Required<span class="required">*</span>
      </label>
      <input
        type="number"
        id="pointsRequired"
        name="pointsRequired"
        class="form-input"
        placeholder="e.g. 250"
        [(ngModel)]="formData.pointsRequired"
        required
        min="1"
        #pointsRequired="ngModel">
    </div>

    <!-- Stock Field -->
    <div class="form-group">
      <label for="stock" class="form-label">
        Stock<span class="required">*</span>
      </label>
      <input
        type="number"
        id="stock"
        name="stock"
        class="form-input"
        placeholder="e.g. 30"
        [(ngModel)]="formData.stock"
        required
        min="1"
        #stock="ngModel">
    </div>

    <!-- Upload Image Field -->
    <div class="form-group">
      <label class="form-label">Upload Image</label>
      <div 
        class="upload-area"
        [class.drag-over]="isDragOver"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
        (click)="fileInput.click()">
        
        <input
          type="file"
          #fileInput
          accept="image/jpeg,image/jpg,image/png"
          (change)="onFileSelect($event)"
          style="display: none;">
        
        <div class="upload-content">
          <div class="upload-icon">
            <i class="fa-solid fa-cloud-arrow-up"></i>
          </div>
          <div class="upload-text">
            <span class="upload-primary">Click to upload or drag and drop</span>
            <span class="upload-secondary">JPG, PNG (Max 2MB)</span>
          </div>
        </div>
        
        <div *ngIf="selectedFileName" class="selected-file">
          Selected: {{ selectedFileName }}
        </div>
      </div>
    </div>
  </form>
    </div>


    <!-- Modal Footer -->
    <div class="modal-footer">
      <button type="button" class="btn btn-cancel" (click)="onCancel()">
        Cancel
      </button>
      <button 
        type="button" 
        class="btn btn-save" 
        (click)="onSave()"
        [disabled]="!isFormValid()">
        Save Gift
      </button>
    </div>
  </div>
</div>
