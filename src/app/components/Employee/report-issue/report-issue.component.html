<div class="report-container ">
    <h1 style="margin-left: 7.5rem;">Report Issue</h1>

    <div class="report-card">
        <form [formGroup]="reportForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="issueType">Issue Type</label>
                <div class="select-wrapper">
                    <select id="issueType" formControlName="issueType" required>
                        <option value="" disabled>Select Issue Type</option>
                        <option value=0>Pickup</option>
                        <option value=1>Warehouse</option>
                        <option value=2>System</option>
                        <option value=3>Other</option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>
                <div *ngIf="reportForm.get('issueType')?.invalid && reportForm.get('issueType')?.touched" class="error-message">
                    Issue type is required
                </div>
            </div>

            <div class="form-group" *ngIf="reportForm.get('pickupId')?.value">
                <label for="pickupId">Pickup Request ID</label>
                <input type="text" id="pickupId" formControlName="pickupId" readonly
                    class="readonly-field">
                <small class="text-info">
                    <i class="fa-solid fa-info-circle"></i>
                    This report is linked to pickup request: {{ reportForm.get('pickupId')?.value }}
                </small>
            </div>

            <div class="form-group" *ngIf="!reportForm.get('pickupId')?.value">
                <label for="pickupId">Pickup Request ID (Optional)</label>
                <input type="text" id="pickupId" formControlName="pickupId"
                    placeholder="Enter pickup request ID if related to a specific pickup">
            </div>

            <div class="form-group">
                <label for="warehouseName">Warehouse Name (Optional)</label>
                <div class="select-wrapper">
                    <select id="warehouseName" formControlName="warehouseName" [disabled]="isLoadingWarehouses">
                        <option value="" disabled selected>
                            {{ isLoadingWarehouses ? 'Loading warehouses...' : 'Select Warehouse' }}
                        </option>
                        <option *ngFor="let warehouse of warehouses; trackBy: trackByWarehouseId"
                            [value]="warehouse.id">
                            {{ warehouse.name }} - {{ warehouse.location }}
                        </option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Describe the issue in detail</label>
                <textarea id="description" formControlName="description" rows="6"
                    placeholder="Provide a detailed description of the issue you encountered..."></textarea>
                <div *ngIf="reportForm.get('description')?.invalid && reportForm.get('description')?.touched" class="error-message">
                    <div *ngIf="reportForm.get('description')?.errors?.['required']">Description is required</div>
                    <div *ngIf="reportForm.get('description')?.errors?.['maxlength']">Description cannot exceed 1000 characters</div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit" [disabled]="!reportForm.valid || isSubmitting">
                    <i class="fa-solid fa-paper-plane" *ngIf="!isSubmitting"></i>
                    <i class="fa-solid fa-spinner fa-spin" *ngIf="isSubmitting"></i>
                    {{ isSubmitting ? 'Submitting...' : 'Report to Admin' }}
                </button>
                <button type="button" [routerLink]="['/employee']" class="btn-cancel" [disabled]="isSubmitting">Cancel</button>
            </div>
        </form>
    </div>
</div>
