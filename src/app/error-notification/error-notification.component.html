<!-- Error Notification Overlay Component -->
<div class="error-overlay" *ngIf="isVisible" (click)="closeNotification()">
  <div class="error-notification" 
       (click)="$event.stopPropagation()"
       (mouseenter)="onMouseEnter()"
       (mouseleave)="onMouseLeave()">
    <div class="d-flex align-items-center">
      <!-- Error X Icon -->
      <div class="error-icon me-3">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z" 
                fill="white"/>
          <path d="M18 6L6 18M6 6l12 12" 
                stroke="white" 
                stroke-width="2" 
                stroke-linecap="round" 
                stroke-linejoin="round"/>
        </svg>
      </div>
      
      <!-- Content -->
      <div class="error-content">
        <h5 class="error-title mb-1">{{ title || 'Error' }}</h5>
        <p class="error-message mb-0">{{ message || 'Something went wrong. Please try again.' }}</p>
      </div>
      
      <!-- Close Button (Optional) -->
      <button type="button" class="btn-close ms-auto" aria-label="Close" (click)="closeNotification()" *ngIf="showCloseButton">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
  </div>
</div>
